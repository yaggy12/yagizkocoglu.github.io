<!-- News Section -->
<section id="news">
    <div class="container">
        <h2 class="text-center text-uppercase text-secondary mb-0">News</h2>
        <hr class="star-dark mb-5">
        <div class="row">
            <!-- News Items -->
            <div class="col-lg-4 col-sm-6 mb-4">
                <a class="news-item d-block mx-auto" href="#newsModal1" data-toggle="modal">
                    <img class="img-fluid" src="img/news/AA.png" alt="Image 1">
                </a>
            </div>
            <div class="col-lg-4 col-sm-6 mb-4">
                <a class="news-item d-block mx-auto" href="#newsModal2" data-toggle="modal">
                    <img class="img-fluid" src="img/news/sdk.png" alt="Image 2">
                </a>
            </div>
            <div class="col-lg-4 col-sm-6 mb-4">
                <a class="news-item d-block mx-auto" href="#newsModal3" data-toggle="modal">
                    <img class="img-fluid" src="img/news/iha.png" alt="Image 3">
                </a>
            </div>
        </div>
    </div>
</section>

<!-- Modal Template -->
<div class="news-modal modal fade" id="newsModalTemplate" tabindex="-1" role="dialog" aria-labelledby="newsModalTemplateLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content">
            <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
            <div class="modal-body text-center">
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-lg-8">
                            <h2 class="news-modal-title text-secondary text-uppercase mb-0" id="newsModalTemplateLabel">Title Placeholder</h2>
                            <hr class="star-dark mb-5">
                            <div class="img-container">
                                <img class="img-fluid mb-5" src="img/news/placeholder.png" alt="Image Placeholder">
                            </div>
                            <p class="mb-5">Description Placeholder.</p>
                            <button class="btn btn-primary" href="#" data-dismiss="modal">
                                <i class="fas fa-times fa-fw"></i>
                                Close Window
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Specific Modals -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const newsItems = [
            { id: 'newsModal1', label: 'newsModal1Label', title: 'Image 1 Title', imgSrc: 'img/news/AA.png', description: 'Description for Image 1.' },
            { id: 'newsModal2', label: 'newsModal2Label', title: 'Image 2 Title', imgSrc: 'img/news/sdk.png', description: 'Description for Image 2.' },
            { id: 'newsModal3', label: 'newsModal3Label', title: 'Image 3 Title', imgSrc: 'img/news/iha.png', description: 'Description for Image 3.' }
        ];

        newsItems.forEach(item => {
            const modalClone = document.querySelector('#newsModalTemplate').cloneNode(true);
            modalClone.id = item.id;
            modalClone.querySelector('.news-modal-title').id = item.label;
            modalClone.querySelector('.news-modal-title').innerText = item.title;
            modalClone.querySelector('img').src = item.imgSrc;
            modalClone.querySelector('img').alt = item.title;
            modalClone.querySelector('p').innerText = item.description;
            document.body.appendChild(modalClone);
        });
    });
</script>
