<!-- News Grid Section -->
<section id="news">
  <div class="container news-flex-grid">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2>Haberler</h2> <!-- Turkish for "News" -->
        <hr class="light">
      </div>
    </div>
    <div class="news-flex-row">
      {% for post in site.news %}
      <div class="news-flex-item news-item">
        <a href="#newsModal-{{ post.modal-id }}" class="news-link" data-toggle="modal">
          <div class="caption">
            <div class="caption-content">
              <i class="fa fa-search-plus fa-3x"></i>
            </div>
          </div>
          <img src="img/news/{{ post.img }}" class="img-responsive" alt="{{ post.alt }}">
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
